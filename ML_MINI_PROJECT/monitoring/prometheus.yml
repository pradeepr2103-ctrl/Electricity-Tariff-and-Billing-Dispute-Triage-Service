global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "tariff-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: "tariff-agent-worker"
    static_configs:
      - targets: ["agent-worker:9100"]
    scrape_interval: 15s

  - job_name: "tariff-llm-stub"
    static_configs:
      - targets: ["llm-stub:8001"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
    scrape_interval: 30s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []
